<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Why is this scroll laggy?</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Sticky topbar: title, scroll-position counter, mode toggle, and a
       canary (JS-driven pulse) whose smoothness reflects main-thread health.
       When the slow scroll handler hogs the main thread, the canary visibly
       freezes; when the fast handler runs, the canary keeps ticking. -->
  <header class="topbar" id="topbar">
    <div class="topbar__row">
      <div class="topbar__left">
        <span class="canary" id="canary" aria-label="main-thread canary"></span>
        <span class="topbar__title">🛵 Swiggy nearby</span>
      </div>
      <div class="topbar__metric">
        Showing <strong id="above-count">0</strong> of <span id="total-count">0</span> above
      </div>
    </div>
    <div class="topbar__row topbar__row--toggle">
      <span class="topbar__label">Scroll handler:</span>
      <div class="modepick" role="tablist">
        <button id="mode-slow" class="modepick__btn modepick__btn--active" type="button" role="tab">Slow (thrashes layout)</button>
        <button id="mode-fast" class="modepick__btn" type="button" role="tab">Fast (cached)</button>
      </div>
      <button id="auto-scroll" class="topbar__autobtn" type="button">Auto-scroll</button>
    </div>
    <div class="topbar__row topbar__row--readouts">
      <span class="topbar__frame" id="handler-readout">handler: — ms</span>
      <span class="topbar__frame" id="frame-readout">last frame: — ms</span>
    </div>
  </header>

  <main class="feed" id="feed">
    <!-- Cards injected by app.js. Now scroll the iframe and watch the canary. -->
  </main>

  <script src="app.js"></script>
</body>
</html>
