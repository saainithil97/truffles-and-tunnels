<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swiggy cart — vanilla, simple</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 0 auto; padding: 0 1rem 2rem; background: #fff7ed; color: #1f2937; }

    /* Same DOM-write counter as the other tabs — lets you compare across all three. */
    .domcounter { position: sticky; top: 0; z-index: 100; background: #1f2937; color: #fff; padding: .55rem .8rem; display: flex; gap: .9rem; align-items: center; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .78rem; margin: 0 -1rem 1.5rem; }
    .domcounter__label { font-weight: 700; opacity: .85; }
    .domcounter__metric strong { color: #fb923c; font-size: 1rem; padding: 0 .15rem; }
    .domcounter__reset { margin-left: auto; background: #fb923c; color: #1f2937; border: 0; padding: .3rem .65rem; border-radius: 5px; font-weight: 700; cursor: pointer; font-size: .72rem; font-family: inherit; }
    .domcounter__reset:hover { background: #f97316; }

    h1 { font-size: 1.3rem; margin: 1rem 0; }
    .card { display: grid; grid-template-columns: 80px 1fr; gap: 1rem; align-items: center; padding: 1rem; background: #fff; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
    .emoji { font-size: 3rem; text-align: center; }
    .name { font-weight: 700; font-size: 1.05rem; }
    .price { color: #6b7280; font-size: .95rem; margin-top: .15rem; }
    /* The Add button and the qty controls live in the same slot — one is
       shown, the other is hidden, depending on qty. */
    .actions { margin-top: .6rem; }
    .add { background: #fb923c; color: #fff; border: 0; padding: .5rem 1rem; font-weight: 700; font-size: .9rem; border-radius: 8px; cursor: pointer; }
    .add:hover { background: #f97316; }
    .qty { display: inline-flex; align-items: center; gap: .8rem; border: 1.5px solid #fb923c; border-radius: 8px; padding: .15rem .3rem; background: #fff; }
    .qty button { background: transparent; border: 0; color: #fb923c; font-size: 1.2rem; font-weight: 700; width: 28px; height: 28px; cursor: pointer; }
    .qty button:hover { color: #f97316; }
    .qty span { font-weight: 700; min-width: 1rem; text-align: center; }
    .subtotal { margin-top: 1.2rem; padding-top: 1rem; border-top: 1px dashed #fed7aa; font-weight: 600; }
    .subtotal .label { color: #6b7280; font-weight: 500; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <!-- DOM-write counter — same instrumentation as the other tabs. -->
  <div class="domcounter">
    <span class="domcounter__label">DOM writes —</span>
    <span class="domcounter__metric">last click: <strong id="lastWrites">0</strong></span>
    <span class="domcounter__metric">total: <strong id="totalWrites">0</strong></span>
    <button id="resetWrites" class="domcounter__reset" type="button">Reset</button>
  </div>

  <div id="observed">

  <h1>🛵 Swiggy — add to cart</h1>

  <div class="card">
    <div class="emoji">🍛</div>
    <div>
      <div class="name">Meghana Biryani</div>
      <div class="price">₹260</div>
      <div class="actions">
        <!-- One of these is visible, depending on qty. Two DOM elements,
             but one logical "what's the button right now" surface. -->
        <button id="add" class="add">Add to cart</button>
        <div id="qty" class="qty hidden">
          <button id="minus" type="button" aria-label="decrease">−</button>
          <span id="qtyNum">0</span>
          <button id="plus" type="button" aria-label="increase">+</button>
        </div>
      </div>
    </div>
  </div>

  <div id="subtotal" class="subtotal hidden">
    <span class="label">Subtotal:</span> ₹<span id="subtotalNum">0</span>
  </div>

  </div><!-- /#observed -->

  <script>
    // The whole app: one dish, one state variable. Click +, qty goes up.
    // Two pieces of UI have to keep up: the button block (Add vs [− N +])
    // and the subtotal line.

    const PRICE = 260;
    let qty = 0;

    const addBtn      = document.getElementById("add");
    const qtyBox      = document.getElementById("qty");
    const qtyNum      = document.getElementById("qtyNum");
    const subtotalBox = document.getElementById("subtotal");
    const subtotalNum = document.getElementById("subtotalNum");

    // The one function that has to keep TWO pieces of UI in sync by hand.
    function render() {
      if (qty === 0) {
        addBtn.classList.remove("hidden");
        qtyBox.classList.add("hidden");
        subtotalBox.classList.add("hidden");
      } else {
        addBtn.classList.add("hidden");
        qtyBox.classList.remove("hidden");
        qtyNum.textContent = qty;
        subtotalBox.classList.remove("hidden");
        subtotalNum.textContent = qty * PRICE;
      }
    }

    addBtn.addEventListener("click", () => { qty = 1; render(); });
    document.getElementById("plus").addEventListener("click",  () => { qty += 1; render(); });
    document.getElementById("minus").addEventListener("click", () => { qty = Math.max(0, qty - 1); render(); });

    render();   // initial paint

    // ---- DOM-write counter (identical to the other tabs) ---------------
    const lastWritesEl  = document.getElementById("lastWrites");
    const totalWritesEl = document.getElementById("totalWrites");
    let totalWrites = 0;
    const observer = new MutationObserver((records) => {
      const n = records.length;
      lastWritesEl.textContent = n;
      totalWrites += n;
      totalWritesEl.textContent = totalWrites;
    });
    observer.observe(document.getElementById("observed"), {
      attributes: true, characterData: true, childList: true, subtree: true,
    });
    document.getElementById("resetWrites").addEventListener("click", () => {
      totalWrites = 0;
      lastWritesEl.textContent = "0";
      totalWritesEl.textContent = "0";
    });
  </script>
</body>
</html>
